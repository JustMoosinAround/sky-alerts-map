name: publish-map
on:
  schedule:
    - cron: "7 14,22,4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: skyfire-map
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out this repo (page files)
        uses: actions/checkout@v4
        with:
          path: pub
          persist-credentials: false
      - name: Check out the private skyfire repo (read-only token)
        uses: actions/checkout@v4
        with:
          repository: JustMoosinAround/skyfire
          token: ${{ secrets.SKY_ALERTS_READ_TOKEN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/pyproject.toml
      - uses: actions/cache@v4
        with:
          path: app/.skyfield
          key: skyfield-de421
      - run: pip install ./app
      - name: Build forecast data
        # Exit 0 = success. Exit 1 (settings problem) or 2 (every map failed)
        # stops the job here, so nothing is published and the old page stays up.
        run: |
          cd app
          skyfire publish-map --out ../pub/site/data
      - name: Publish to gh-pages
        env:
          TOKEN: ${{ github.token }}
        run: |
          touch pub/site/.nojekyll
          mkdir -p /tmp/out && cp -a pub/site/. /tmp/out/
          cd /tmp/out
          git init -q && git checkout -q -b gh-pages
          git add -A && git -c user.name="skyfire-bot" -c user.email="actions@users.noreply.github.com" commit -qm "publish $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
